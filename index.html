<html lang="en">

      name="description"
      content="Full-stack developer in Kigali, Rwanda. Backend engineering with C#, Blazor, Node.js and Python, plus IoT and embedded systems work."

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%BB</text></svg>" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const saved = localStorage.getItem('theme')
        const dark =
          saved === 'dark' ||
          (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
